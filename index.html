<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highfield Pairs</title>
  <meta name="description" content="Match all 6 pairs of Highfield photos.">
  <meta name="theme-color" content="#002034">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #002034;
      --surface: #f7f8f4;
      --ink: #002034;
      --muted: #3d5563;
      --primary: #7a8618;
      --font: "Nunito", ui-sans-serif, system-ui, sans-serif;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --radius: 1rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }
    button { font-family: inherit; }
    button:not(:disabled) { cursor: pointer; }
    header {
      background: var(--bg);
      color: var(--surface);
      border-bottom: 4px solid var(--primary);
    }
    .wrap { max-width: 32rem; margin: 0 auto; padding: 0 1rem; }
    header .wrap { padding-top: 1.75rem; padding-bottom: 1.5rem; }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 500;
      font-size: 1.875rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--surface);
    }
    .lede {
      margin: 0.5rem 0 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      color: rgb(255 255 255 / 0.9);
    }
    main.wrap { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat {
      background: var(--surface);
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      box-shadow: 0 1px 2px rgb(26 46 34 / 0.06);
    }
    .stat p { margin: 0; }
    .stat .k { font-size: 0.875rem; font-weight: 800; color: var(--muted); }
    .stat .v {
      font-family: var(--display);
      font-size: 1.875rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    #win {
      display: none;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      font-family: var(--display);
      font-size: 1.5rem;
      line-height: 1.3;
      box-shadow: inset 0 0 0 2px var(--primary);
    }
    #win.show { display: block; }
    #again {
      min-height: 3rem;
      border-radius: 999px;
      border: 0;
      background: var(--surface);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--primary);
      font-size: 1rem;
      font-weight: 800;
    }
    #again.won {
      background: var(--surface);
      color: var(--ink);
      box-shadow: inset 0 0 0 2px var(--primary);
      font-size: 1.125rem;
    }
    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .pair-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: var(--radius);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .pair-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .pair-card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 400ms cubic-bezier(0.2, 0.75, 0.2, 1);
    }
    .pair-card.is-up .pair-card-inner { transform: rotateY(180deg); }
    .pair-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 1px 2px rgb(26 46 34 / 0.08), 0 8px 18px rgb(26 46 34 / 0.06);
    }
    .pair-face-front { transform: rotateY(180deg); background: var(--surface); }
    .pair-card.is-matched .pair-face-front {
      box-shadow: inset 0 0 0 3px var(--primary), 0 8px 18px rgb(26 46 34 / 0.06);
    }
    .pair-back {
      background-color: #00141c;
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 10px, rgb(122 134 24 / 0.28) 10px, rgb(122 134 24 / 0.28) 11px);
      color: var(--primary);
    }
    .monogram {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .monogram span {
      width: 3rem;
      height: 3rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(122 134 24 / 0.18);
      font-family: var(--display);
      font-size: 1.875rem;
      line-height: 1;
    }
    .pair-face-front img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgb(255 255 255 / 0.95);
      color: var(--ink);
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.25;
      font-weight: 800;
      padding: 0.25rem;
    }
    .missing {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--ink);
    }
    footer { text-align: center; padding: 1rem 1rem calc(7rem + env(safe-area-inset-bottom, 0px)); }
    footer img { display: block; width: min(100%, 32rem); height: auto; margin: 0 auto; }
    [data-created-with-grok-banner] { top: auto !important; bottom: 12px !important; }
    [data-created-with-grok-spacer] { display: none !important; height: 0 !important; }
    @media (max-width: 767px), ((hover: none) and (pointer: coarse)) {
      [data-created-with-grok-banner] { bottom: 0 !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pair-card-inner { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Highfield Pairs</h1>
      <p class="lede">Match all 6 pairs as quickly as you can.</p>
    </div>
  </header>
  <main class="wrap">
    <div class="stats">
      <div class="stat"><p class="k">Moves</p><p class="v" id="moves">0</p></div>
      <div class="stat"><p class="k">Time</p><p class="v" id="time">0:00</p></div>
    </div>
    <p id="win" role="status">Well done! You've completed Highfield Pairs!</p>
    <button type="button" id="again">Play Again</button>
    <ul class="grid" id="board"></ul>
  </main>

    ];
    var MISMATCH_MS = 1000;

    var deck = [];
    var up = [];
    var matched = [];
    var moves = 0;
    var locked = false;
    var won = false;
    var startedAt = null;
    var timer = 0;
    var flipTimer = 0;
    var round = 0;

    var board = document.getElementById("board");
    var movesEl = document.getElementById("moves");
    var timeEl = document.getElementById("time");
    var winEl = document.getElementById("win");
    var againBtn = document.getElementById("again");

    var audioCtx = null;
    var noiseBuffer = null;
    function audio() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      } catch (err) {
        return null;
      }
    }
    function blip(ctx, frequency, when, duration, type, peak) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, when);
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(peak, when + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + duration + 0.02);
    }
    function whooshNoise(ctx) {
      if (noiseBuffer && noiseBuffer.sampleRate === ctx.sampleRate) return noiseBuffer;
      var length = Math.floor(ctx.sampleRate * 0.3);
      var buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      noiseBuffer = buffer;
      return buffer;
    }
    function playSwoosh(down) {
      var ctx = audio();
      if (!ctx) return;
      var t = ctx.currentTime;
      var src = ctx.createBufferSource();
      src.buffer = whooshNoise(ctx);
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.setValueAtTime(0.7, t);
      filter.frequency.setValueAtTime(down ? 2400 : 320, t);
      filter.frequency.exponentialRampToValueAtTime(down ? 360 : 3200, t + 0.16);
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.85, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.22);
    }
    function playMatch(delay) {
      var ctx = audio();
      if (!ctx) return;
      var t = ctx.currentTime + (delay || 0);
      blip(ctx, 523.25, t, 0.2, "sine", 0.55);
      blip(ctx, 659.25, t + 0.09, 0.24, "sine", 0.48);
      blip(ctx, 783.99, t + 0.16, 0.38, "triangle", 0.36);
    }
    function playMiss(delay) {
      var ctx = audio();
      if (!ctx) return;
      var t = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var filter = ctx.createBiquadFilter();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(90, t + 0.22);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(700, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.55, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    function formatTime(ms) {
      var total = Math.max(0, Math.floor(ms / 1000));
      var m = Math.floor(total / 60);
      var s = total % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function shuffle() {
      var cards = [];
      for (var i = 0; i < PAIR_IMAGES.length; i++) {
        cards.push({ uid: i + "-a-" + Math.random().toString(36).slice(2), pairIndex: i });
        cards.push({ uid: i + "-b-" + Math.random().toString(36).slice(2), pairIndex: i });
      }
      for (var n = cards.length - 1; n > 0; n--) {
        var j = Math.floor(Math.random() * (n + 1));
        var swap = cards[n];
        cards[n] = cards[j];
        cards[j] = swap;
      }
      return cards;
    }

    function stopClock() {
      if (timer) cancelAnimationFrame(timer);
      timer = 0;
    }

    function startClock() {
      stopClock();
      var last = -1;
      function tick() {
        var ms = Date.now() - startedAt;
        var sec = Math.floor(ms / 1000);
        if (sec !== last) {
          last = sec;
          timeEl.textContent = formatTime(ms);
        }
        timer = requestAnimationFrame(tick);
      }
      timer = requestAnimationFrame(tick);
    }

    function cardButton(card) {
      var photo = PAIR_IMAGES[card.pairIndex];
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pair-card";
      btn.setAttribute("aria-label", "Face-down card");

      var inner = document.createElement("span");
      inner.className = "pair-card-inner";

      var back = document.createElement("span");
      back.className = "pair-face pair-back";
      back.innerHTML = '<span class="monogram"><span>H</span></span>';

      var front = document.createElement("span");
      front.className = "pair-face pair-face-front";
      var img = document.createElement("img");
      img.alt = "";
      img.draggable = false;
      img.src = photo.file.indexOf("data:") === 0 ? photo.file : ("images/" + photo.file);
      img.addEventListener("error", function () {
        img.remove();
        var miss = document.createElement("span");
        miss.className = "missing";
        miss.textContent = "Add " + photo.file;
        front.insertBefore(miss, front.firstChild);
      });
      var cap = document.createElement("span");
      cap.className = "caption";
      cap.textContent = photo.label;
      front.appendChild(img);
      front.appendChild(cap);
      inner.appendChild(back);
      inner.appendChild(front);
      btn.appendChild(inner);
      btn.addEventListener("click", function () { onPick(card, btn, photo); });
      li.appendChild(btn);
      return li;
    }

    function paint(btn, photo, faceUp, isMatched) {
      btn.classList.toggle("is-up", faceUp);
      btn.classList.toggle("is-matched", isMatched);
      btn.setAttribute(
        "aria-label",
        isMatched ? photo.label + ", matched" : faceUp ? photo.label : "Face-down card"
      );
    }

    function render() {
      board.textContent = "";
      deck.forEach(function (card) {
        board.appendChild(cardButton(card));
      });
    }

    function onPick(card, btn, photo) {
      if (locked || won) return;
      if (matched.indexOf(card.pairIndex) !== -1) return;
      if (up.indexOf(card.uid) !== -1) return;
      if (startedAt == null) {
        startedAt = Date.now();
        startClock();
      }
      if (up.length === 0) {
        playSwoosh(false);
        up = [card.uid];
        paint(btn, photo, true, false);
        return;
      }
      var first = null;
      var firstBtn = null;
      var buttons = board.querySelectorAll(".pair-card");
      for (var i = 0; i < deck.length; i++) {
        if (deck[i].uid === up[0]) {
          first = deck[i];
          firstBtn = buttons[i];
        }
      }
      if (!first) return;
      up = [first.uid, card.uid];
      moves += 1;
      movesEl.textContent = String(moves);
      playSwoosh(false);
      if (first.pairIndex === card.pairIndex) {
        playMatch(0.08);
        matched = matched.concat([card.pairIndex]);
        up = [];
        var firstPhoto = PAIR_IMAGES[first.pairIndex];
        paint(firstBtn, firstPhoto, true, true);
        paint(btn, photo, true, true);
        if (matched.length === PAIR_IMAGES.length) {
          stopClock();
          timeEl.textContent = formatTime(Date.now() - startedAt);
          won = true;
          winEl.classList.add("show");
          againBtn.classList.add("won");
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          winEl.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
        }
        return;
      }
      locked = true;
      playMiss(0.08);
      paint(btn, photo, true, false);
      var token = round;
      clearTimeout(flipTimer);
      flipTimer = setTimeout(function () {
        if (token !== round) return;
        playSwoosh(true);
        up = [];
        locked = false;
        paint(firstBtn, PAIR_IMAGES[first.pairIndex], false, false);
        paint(btn, photo, false, false);
      }, MISMATCH_MS);
    }

    function restart() {
      round += 1;
      clearTimeout(flipTimer);
      stopClock();
      locked = false;
      up = [];
      matched = [];
      moves = 0;
      won = false;
      startedAt = null;
      movesEl.textContent = "0";
      timeEl.textContent = "0:00";
      winEl.classList.remove("show");
      againBtn.classList.remove("won");
      deck = shuffle();
      render();
    }

    againBtn.addEventListener("click", restart);
    restart();
  </script>
